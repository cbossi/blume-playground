name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Build und Deploy sind getrennte Jobs (jeweils eigener, frischer Runner):
# der Build-Job lädt dist/ als Pages-Artefakt hoch, der Deploy-Job holt es
# von dort und veröffentlicht es — er braucht daher weder Checkout noch Build.
# Vorteile der Trennung: Protection Rules am github-pages-Environment
# blockieren nur den Deploy, und ein fehlgeschlagener Deploy lässt sich
# re-runnen, ohne neu zu bauen.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build --strict
        env:
          DEPLOY_TARGET: github-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
